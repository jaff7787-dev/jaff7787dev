:root{
  --bg1:#FFF7E8; --bg2:#FFE9F0;
  --ink:#2B2143;
  --card:#FFFFFF;
  --line:#2B2143;
  --yellow:#FFD43B; --orange:#FF9A3C; --pink:#FF6FA5;
  --purple:#7C5CFF; --green:#3ECF8E; --red:#FF5D5D;
  --blue:#4DA3FF;
  --shadow:0 6px 0 #2B214322;
  --hard:4px 4px 0 #2B2143;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'PTD','Pretendard',-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  font-weight:800;
  color:var(--ink);
  background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%) fixed;
  overflow-x:hidden;
  user-select:none;-webkit-user-select:none;
}
/* floating bg deco */
.bg-deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.bg-deco span{position:absolute;font-size:34px;opacity:.14;animation:float 9s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-26px) rotate(8deg)}}

#app{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:0 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;}
.screen{display:none;flex:1;flex-direction:column;animation:pop-in .35s cubic-bezier(.2,1.4,.4,1);}
.screen.active{display:flex;}
@keyframes pop-in{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}

/* ---------- HOME ---------- */
.home-head{text-align:center;padding:34px 0 10px;}
.home-mascot{font-size:64px;display:inline-block;animation:bounce 2.2s ease-in-out infinite;filter:drop-shadow(0 6px 0 #2B214322);}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}
h1{font-size:34px;letter-spacing:-1px;margin-top:6px;}
h1 .grad{background:linear-gradient(90deg,var(--purple),var(--pink),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent;}
.home-sub{font-size:15px;font-weight:400;color:#6B6288;margin-top:6px;}

.stat-row{display:flex;gap:10px;margin:18px 0 14px;}
.stat{flex:1;background:var(--card);border:3px solid var(--line);border-radius:18px;box-shadow:var(--hard);padding:12px 6px;text-align:center;}
.stat .num{font-size:24px;}
.stat .lbl{font-size:12px;font-weight:400;color:#6B6288;margin-top:2px;}

.review-btn{
  display:none;width:100%;border:3px solid var(--line);border-radius:20px;
  background:linear-gradient(100deg,#FFB3C7,#FFD43B);box-shadow:var(--hard);
  padding:16px 18px;font:inherit;font-size:18px;color:var(--ink);
  margin-bottom:16px;cursor:pointer;align-items:center;justify-content:space-between;
  transition:transform .1s;
}
.review-btn.show{display:flex;}
.review-btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line);}
.review-btn .badge{background:var(--red);color:#fff;border:3px solid var(--line);border-radius:999px;padding:4px 14px;font-size:16px;}

.day-title{font-size:20px;margin:6px 2px 12px;display:flex;align-items:center;gap:8px;}
.day-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding-bottom:10px;}
.day-cell{
  position:relative;background:var(--card);border:3px solid var(--line);border-radius:16px;
  box-shadow:var(--hard);padding:12px 4px 9px;text-align:center;cursor:pointer;
  font:inherit;color:var(--ink);transition:transform .1s;
}
.day-cell:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line);}
.day-cell .dnum{font-size:19px;}
.day-cell .dstars{font-size:11px;letter-spacing:1px;margin-top:3px;color:#D9D3E8;}
.day-cell .dstars .on{color:#FFB800;}
.day-cell.done{background:linear-gradient(160deg,#FFF6D6,#FFECB3);}
.day-cell.perfect{background:linear-gradient(160deg,#E9E1FF,#D3F5E9);}
.day-cell .crown{position:absolute;top:-12px;right:-6px;font-size:18px;transform:rotate(18deg);}

/* ---------- QUIZ ---------- */
.quiz-top{display:flex;align-items:center;gap:10px;padding:18px 0 6px;}
.icon-btn{
  width:44px;height:44px;flex:none;border:3px solid var(--line);border-radius:14px;background:var(--card);
  box-shadow:var(--hard);font-size:19px;cursor:pointer;transition:transform .1s;font-family:inherit;
  display:flex;align-items:center;justify-content:center;
}
.icon-btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line);}
.progress-wrap{flex:1;}
.progress-info{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
.progress-info .pi-right{color:var(--purple);}
.pbar{height:16px;background:#fff;border:3px solid var(--line);border-radius:999px;overflow:hidden;}
.pbar .fill{height:100%;width:0%;background:linear-gradient(90deg,var(--green),var(--yellow));border-radius:999px;transition:width .4s cubic-bezier(.2,1.2,.4,1);}

.hud{display:flex;align-items:center;justify-content:space-between;margin:10px 0 4px;min-height:44px;}
.score-chip{background:var(--card);border:3px solid var(--line);border-radius:999px;box-shadow:var(--hard);padding:7px 16px;font-size:17px;display:flex;gap:6px;align-items:center;}
.combo-chip{
  display:none;background:linear-gradient(100deg,#FF9A3C,#FF5D5D);color:#fff;border:3px solid var(--line);
  border-radius:999px;box-shadow:var(--hard);padding:7px 16px;font-size:16px;
}
.combo-chip.on{display:block;animation:combo-pop .3s cubic-bezier(.2,2,.4,1);}
@keyframes combo-pop{from{transform:scale(.6)}to{transform:scale(1)}}

.mascot-row{text-align:center;margin:2px 0 0;height:64px;}
#mascot{font-size:52px;display:inline-block;transition:transform .2s;}
#mascot.happy{animation:m-happy .55s cubic-bezier(.2,1.6,.4,1);}
#mascot.sad{animation:m-sad .55s ease;}
@keyframes m-happy{0%{transform:scale(1)}35%{transform:scale(1.45) rotate(-8deg)}70%{transform:scale(1.2) rotate(8deg)}100%{transform:scale(1)}}
@keyframes m-sad{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
#speech{
  display:inline-block;font-size:14px;background:#fff;border:3px solid var(--line);
  border-radius:14px;padding:5px 12px;margin-left:6px;vertical-align:middle;
  opacity:0;transform:scale(.6);transition:all .25s cubic-bezier(.2,1.6,.4,1);
}
#speech.show{opacity:1;transform:scale(1);}

.word-card{
  position:relative;background:var(--card);border:4px solid var(--line);border-radius:26px;
  box-shadow:6px 6px 0 var(--line);padding:34px 18px 30px;text-align:center;margin:8px 0 18px;
}
.word-card .wc-tag{
  position:absolute;top:-14px;left:50%;transform:translateX(-50%);
  background:var(--purple);color:#fff;border:3px solid var(--line);border-radius:999px;
  padding:4px 16px;font-size:13px;white-space:nowrap;
}
#word{font-size:44px;letter-spacing:-1px;line-height:1.1;word-break:keep-all;overflow-wrap:break-word;}
#word.long{font-size:30px;}
#word.xlong{font-size:24px;}
.tts-btn{
  margin-top:12px;border:3px solid var(--line);background:var(--yellow);border-radius:999px;
  font:inherit;font-size:14px;padding:7px 16px;cursor:pointer;box-shadow:var(--hard);transition:transform .1s;color:var(--ink);
}
.tts-btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line);}

.choices{display:flex;flex-direction:column;gap:12px;padding-bottom:8px;}
.choice{
  display:flex;align-items:center;gap:12px;text-align:left;
  background:var(--card);border:3px solid var(--line);border-radius:18px;box-shadow:var(--hard);
  padding:15px 15px;font:inherit;font-size:17px;line-height:1.35;color:var(--ink);cursor:pointer;
  transition:transform .1s;word-break:keep-all;
}
.choice .cnum{
  flex:none;width:34px;height:34px;border:3px solid var(--line);border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--bg1);
}
.choice:not(:disabled):active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line);}
.choice:disabled{cursor:default;}
.choice.correct{background:var(--green);color:#fff;animation:pick-pop .4s cubic-bezier(.2,1.8,.4,1);}
.choice.correct .cnum{background:#fff;color:var(--ink);}
.choice.wrong{background:var(--red);color:#fff;animation:m-sad .45s ease;}
.choice.wrong .cnum{background:#fff;color:var(--ink);}
.choice.dim{opacity:.45;}
@keyframes pick-pop{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}

/* ---------- RESULT ---------- */
.result-head{text-align:center;padding-top:44px;}
#result-emoji{font-size:84px;display:inline-block;animation:bounce 2s ease-in-out infinite;}
#result-title{font-size:32px;margin-top:8px;}
#result-msg{font-size:15px;font-weight:400;color:#6B6288;margin-top:6px;}
.result-stars{font-size:44px;letter-spacing:6px;margin-top:10px;color:#E4DEF2;}
.result-stars .on{color:#FFB800;display:inline-block;animation:star-in .5s cubic-bezier(.2,1.8,.4,1) backwards;}
.result-stars .on:nth-child(2){animation-delay:.15s}
.result-stars .on:nth-child(3){animation-delay:.3s}
@keyframes star-in{from{transform:scale(0) rotate(-120deg)}to{transform:scale(1) rotate(0)}}

.result-stats{display:flex;gap:10px;margin:20px 0;}
.wrong-box{background:var(--card);border:3px solid var(--line);border-radius:20px;box-shadow:var(--hard);padding:16px;margin-bottom:18px;}
.wrong-box h3{font-size:16px;margin-bottom:10px;}
.wrong-item{display:flex;gap:10px;padding:9px 0;border-top:2px dashed #E4DEF2;align-items:baseline;}
.wrong-item .ww{font-size:16px;color:var(--red);flex:none;max-width:46%;}
.wrong-item .wm{font-size:13.5px;font-weight:400;color:#4A4166;line-height:1.4;}

.big-btn{
  width:100%;border:3px solid var(--line);border-radius:20px;box-shadow:var(--hard);
  padding:17px;font:inherit;font-size:18px;color:var(--ink);cursor:pointer;margin-bottom:12px;
  transition:transform .1s;
}
.big-btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line);}
.big-btn.primary{background:linear-gradient(100deg,var(--yellow),var(--orange));}
.big-btn.danger{background:linear-gradient(100deg,#FFB3C7,#FF8FA3);}
.big-btn.plain{background:var(--card);}

/* effects layers */
#fx-canvas{position:fixed;inset:0;pointer-events:none;z-index:50;}
.float-txt{
  position:fixed;z-index:60;pointer-events:none;font-size:26px;font-weight:800;color:var(--green);
  text-shadow:2px 2px 0 #fff;animation:float-up 1s ease-out forwards;
}
@keyframes float-up{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-70px) scale(1.25)}}
.big-cheer{
  position:fixed;z-index:60;left:50%;top:38%;pointer-events:none;font-size:34px;color:#fff;
  background:linear-gradient(100deg,var(--purple),var(--pink));border:4px solid var(--line);border-radius:22px;
  padding:12px 26px;box-shadow:6px 6px 0 var(--line);
  animation:cheer .9s cubic-bezier(.2,1.6,.4,1) forwards;white-space:nowrap;
}
@keyframes cheer{
  0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}
  25%{transform:translate(-50%,-50%) scale(1.1) rotate(2deg);opacity:1}
  70%{transform:translate(-50%,-50%) scale(1);opacity:1}
  100%{transform:translate(-50%,-60%) scale(.95);opacity:0}
}
@media (max-height:700px){
  #word{font-size:36px;}
  .mascot-row{height:56px;}
  #mascot{font-size:44px;}
  .word-card{padding:26px 16px 22px;}
}
</style>

<script src="vocab.js"></script>
<script>
'use strict';
/* ================= data & storage ================= */
const DAYS = VOCAB.length;
const LS_BEST = 'vocaQuest.best';   // {day: {stars,pct,score}}
const LS_WRONG = 'vocaQuest.wrong'; // ["d-i", ...]
const LS_MUTE = 'vocaQuest.mute';
const store = {
  best: JSON.parse(localStorage.getItem(LS_BEST) || '{}'),
  wrong: new Set(JSON.parse(localStorage.getItem(LS_WRONG) || '[]')),
  saveBest(){ localStorage.setItem(LS_BEST, JSON.stringify(this.best)); },
  saveWrong(){ localStorage.setItem(LS_WRONG, JSON.stringify([...this.wrong])); },
};
let muted = localStorage.getItem(LS_MUTE) === '1';

/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pickEmoji = arr => arr[Math.floor(Math.random()*arr.length)];
function show(screen){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(screen).classList.add('active');
  window.scrollTo(0,0);
}

/* ================= bg deco ================= */
(function(){
  const icons = ['⭐','✨','📚','🎈','🍀','💜','🧡','🔤'];
  const box = $('bg-deco');
  for (let i=0;i<14;i++){
    const s = document.createElement('span');
    s.textContent = icons[i % icons.length];
    s.style.left = (Math.random()*94)+'%';
    s.style.top = (Math.random()*94)+'%';
    s.style.animationDelay = (Math.random()*8)+'s';
    s.style.fontSize = (22+Math.random()*26)+'px';
    box.appendChild(s);
  }
})();

/* ================= sound (WebAudio) ================= */
let actx = null;
function beep(freq, dur, type, when, vol){
  if (muted) return;
  try{
    if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime + (when||0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type||'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol||0.12, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t+dur);
  }catch(e){}
}
const sfx = {
  correct(){ beep(660,.12,'triangle',0); beep(880,.16,'triangle',.09); },
  combo(){ beep(660,.1,'triangle',0); beep(880,.1,'triangle',.08); beep(1174,.2,'triangle',.16); },
  wrong(){ beep(220,.22,'sawtooth',0,.07); beep(180,.3,'sawtooth',.1,.06); },
  tap(){ beep(520,.06,'sine',0,.06); },
  fanfare(){ [523,659,784,1046].forEach((f,i)=>beep(f,.22,'triangle',i*.12)); },
};

/* ================= TTS ================= */
function speak(text){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\[.*?\]/g,' ').replace(/\(.*?\)/g,' '));
    u.lang = 'en-US'; u.rate = .92;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ================= confetti ================= */
const canvas = $('fx-canvas'), ctx = canvas.getContext('2d');
let parts = [], fxRunning = false;
function resizeCanvas(){ canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', resizeCanvas); resizeCanvas();
const CONF_COLORS = ['#FFD43B','#FF9A3C','#FF6FA5','#7C5CFF','#3ECF8E','#4DA3FF','#FF5D5D'];
function burst(x, y, n){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = 4+Math.random()*7;
    parts.push({
      x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp-4,
      w: 6+Math.random()*7, h: 4+Math.random()*5,
      r: Math.random()*Math.PI, vr: (Math.random()-.5)*.4,
      c: CONF_COLORS[Math.floor(Math.random()*CONF_COLORS.length)],
      life: 60+Math.random()*35, shape: Math.random()<.25 ? 'circle' : 'rect',
    });
  }
  if (!fxRunning){ fxRunning = true; requestAnimationFrame(tickFx); }
}
function tickFx(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  parts = parts.filter(p=>p.life>0);
  for (const p of parts){
    p.x += p.vx; p.y += p.vy; p.vy += .25; p.vx *= .99; p.r += p.vr; p.life--;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
    ctx.globalAlpha = Math.min(1, p.life/30);
    ctx.fillStyle = p.c;
    if (p.shape==='circle'){ ctx.beginPath(); ctx.arc(0,0,p.w/2,0,7); ctx.fill(); }
    else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    ctx.restore();
  }
  if (parts.length){ requestAnimationFrame(tickFx); }
  else { fxRunning = false; ctx.clearRect(0,0,canvas.width,canvas.height); }
}
function floatText(x, y, txt, color){
  const el = document.createElement('div');
  el.className = 'float-txt'; el.textContent = txt;
  if (color) el.style.color = color;
  el.style.left = (x-20)+'px'; el.style.top = (y-30)+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1000);
}
function bigCheer(txt){
  const el = document.createElement('div');
  el.className = 'big-cheer'; el.textContent = txt;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 900);
}

/* ================= home ================= */
function renderHome(){
  let cleared = 0, stars = 0;
  const grid = $('day-grid'); grid.innerHTML = '';
  for (let d=0; d<DAYS; d++){
    const b = store.best[d];
    if (b){ if (b.stars >= 1) cleared++; stars += b.stars; }
    const cell = document.createElement('button');
    cell.className = 'day-cell' + (b && b.stars >= 1 ? (b.stars===3 ? ' perfect' : ' done') : '');
    const s = b ? b.stars : 0;
    cell.innerHTML =
      (s===3 ? '<span class="crown">👑</span>' : '') +
      '<div class="dnum">' + (d+1) + '</div>' +
      '<div class="dstars">' +
        [1,2,3].map(i=>'<span class="'+(i<=s?'on':'')+'">★</span>').join('') +
      '</div>';
    cell.onclick = ()=>{ sfx.tap(); startDay(d); };
    grid.appendChild(cell);
  }
  $('stat-days').textContent = cleared + ' / ' + DAYS;
  $('stat-stars').textContent = '⭐ ' + stars;
  $('stat-wrong').textContent = store.wrong.size;
  $('review-count').textContent = store.wrong.size + '개';
  $('btn-review').classList.toggle('show', store.wrong.size > 0);
}

/* ================= quiz session ================= */
const MASCOT_HAPPY = ['😸','🥳','😍','🤩','😆','🐥'];
const MASCOT_SAD = ['😿','🥺','😵','😖'];
const CHEER_WORDS = ['좋아요!','대단해!','천재인데?','완벽해!','굉장해!','멋져요!'];
const OOPS_WORDS = ['아쉬워요!','괜찮아요!','다시 기억해요!','힘내요!'];

let S = null; // session

function makeQuestions(list){ // list of {d,i}
  return shuffle(list.slice()).map(q=>{
    const day = VOCAB[q.d], answer = day[q.i];
    const used = new Set([answer.m]);
    const others = [];
    const idxs = shuffle([...Array(day.length).keys()]);
    for (const j of idxs){
      if (j===q.i) continue;
      if (used.has(day[j].m)) continue;
      used.add(day[j].m); others.push(day[j].m);
      if (others.length===3) break;
    }
    // fallback: pull from other days if same day lacks distinct meanings
    while (others.length<3){
      const rd = VOCAB[Math.floor(Math.random()*DAYS)];
      const rm = rd[Math.floor(Math.random()*rd.length)].m;
      if (!used.has(rm)){ used.add(rm); others.push(rm); }
    }
    const choices = shuffle([answer.m, ...others]);
    return { d:q.d, i:q.i, w:answer.w, m:answer.m, choices, ci:choices.indexOf(answer.m) };
  });
}

function startDay(d){
  const list = VOCAB[d].map((_,i)=>({d,i}));
  startSession({ type:'day', day:d, questions:makeQuestions(list), label:'DAY '+(d+1) });
}
function startReview(){
  const list = [...store.wrong].map(k=>{ const [d,i]=k.split('-').map(Number); return {d,i}; });
  if (!list.length) return;
  startSession({ type:'review', questions:makeQuestions(list), label:'📕 오답 복습' });
}
function startSession(cfg){
  S = Object.assign({ idx:0, score:0, combo:0, maxCombo:0, correct:0, wrongQs:[], locked:false }, cfg);
  $('p-day').textContent = S.label;
  $('score').textContent = '0';
  $('combo-chip').classList.remove('on');
  setMascot('🐥','');
  show('screen-quiz');
  renderQuestion();
}
function setMascot(emoji, anim){
  const m = $('mascot');
  m.textContent = emoji;
  m.classList.remove('happy','sad');
  if (anim){ void m.offsetWidth; m.classList.add(anim); }
}
function saySpeech(txt, color){
  const s = $('speech');
  s.textContent = txt;
  s.style.color = color || 'var(--ink)';
  s.classList.add('show');
  clearTimeout(saySpeech._t);
  saySpeech._t = setTimeout(()=>s.classList.remove('show'), 1300);
}

function renderQuestion(){
  const q = S.questions[S.idx];
  S.locked = false;
  $('p-count').textContent = (S.idx+1) + ' / ' + S.questions.length;
  $('p-fill').style.width = (S.idx / S.questions.length * 100) + '%';
  const w = $('word');
  w.textContent = q.w;
  w.className = q.w.length > 22 ? 'xlong' : (q.w.length > 12 ? 'long' : '');
  const box = $('choices'); box.innerHTML = '';
  q.choices.forEach((c, i)=>{
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.innerHTML = '<span class="cnum">'+(i+1)+'</span><span>'+escapeHtml(c)+'</span>';
    btn.onclick = ()=>answer(i, btn);
    box.appendChild(btn);
  });
}
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function answer(i, btn){
  if (S.locked) return;
  S.locked = true;
  const q = S.questions[S.idx];
  const btns = [...document.querySelectorAll('.choice')];
  btns.forEach(b=>b.disabled = true);
  const key = q.d + '-' + q.i;
  const rect = btn.getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;

  if (i === q.ci){
    S.combo++; S.correct++;
    S.maxCombo = Math.max(S.maxCombo, S.combo);
    const gain = 10 + Math.min(10, (S.combo-1)*2);
    S.score += gain;
    btn.classList.add('correct');
    btns.forEach((b,bi)=>{ if (bi!==i) b.classList.add('dim'); });
    $('score').textContent = S.score;
    const cc = $('combo-chip');
    if (S.combo >= 2){ cc.classList.remove('on'); void cc.offsetWidth; cc.classList.add('on'); $('combo').textContent = S.combo; }
    burst(cx, cy, S.combo >= 5 ? 46 : 28);
    floatText(cx, rect.top, '+' + gain);
    setMascot(pickEmoji(MASCOT_HAPPY), 'happy');
    saySpeech(pickEmoji(CHEER_WORDS), '#1F9E68');
    if (S.combo > 0 && S.combo % 5 === 0){ bigCheer('🔥 ' + S.combo + ' 콤보 폭발!'); sfx.combo(); burst(innerWidth/2, innerHeight*.35, 60); }
    else sfx.correct();
    if (S.type === 'review'){ store.wrong.delete(key); store.saveWrong(); }
    setTimeout(next, 950);
  } else {
    S.combo = 0;
    $('combo-chip').classList.remove('on');
    btn.classList.add('wrong');
    btns[q.ci].classList.add('correct');
    btns.forEach((b,bi)=>{ if (bi!==i && bi!==q.ci) b.classList.add('dim'); });
    setMascot(pickEmoji(MASCOT_SAD), 'sad');
    saySpeech(pickEmoji(OOPS_WORDS), '#D6455D');
    floatText(cx, rect.top, '앗!', '#FF5D5D');
    sfx.wrong();
    S.wrongQs.push(q);
    store.wrong.add(key); store.saveWrong();
    setTimeout(next, 1700);
  }
}
function next(){
  S.idx++;
  if (S.idx >= S.questions.length) finish();
  else renderQuestion();
}

/* ================= result ================= */
function finish(){
  const total = S.questions.length;
  const pct = Math.round(S.correct / total * 100);
  const stars = pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 50 ? 1 : 0;
  if (S.type === 'day'){
    const prev = store.best[S.day];
    if (!prev || pct > prev.pct || (pct === prev.pct && S.score > prev.score)){
      store.best[S.day] = { stars, pct, score:S.score };
      store.saveBest();
    }
  }
  const em = pct===100 ? '🏆' : pct>=90 ? '🥇' : pct>=70 ? '🎉' : pct>=50 ? '💪' : '🌱';
  const title = pct===100 ? '완벽 그 자체!' : pct>=90 ? '거의 다 왔어요!' : pct>=70 ? '잘했어요!' : pct>=50 ? '좋은 출발!' : '다시 도전!';
  $('result-emoji').textContent = em;
  $('result-title').textContent = title;
  $('result-msg').textContent = total + '문제 중 ' + S.correct + '개 정답 · 정답률 ' + pct + '%';
  $('result-stars').innerHTML = [1,2,3].map(i=>'<span class="'+(i<=stars?'on':'')+'">★</span>').join('');
  $('r-correct').textContent = S.correct + ' / ' + total;
  $('r-score').textContent = '💎 ' + S.score;
  $('r-combo').textContent = '🔥 ' + S.maxCombo;

  const wb = $('wrong-box'), wl = $('wrong-list');
  if (S.wrongQs.length){
    wb.style.display = 'block';
    wl.innerHTML = S.wrongQs.map(q=>
      '<div class="wrong-item"><span class="ww">'+escapeHtml(q.w)+'</span><span class="wm">'+escapeHtml(q.m)+'</span></div>'
    ).join('');
    $('btn-retry-wrong').style.display = 'block';
  } else {
    wb.style.display = 'none';
    $('btn-retry-wrong').style.display = 'none';
  }
  show('screen-result');
  if (stars >= 2){ sfx.fanfare(); setTimeout(()=>{ burst(innerWidth*.3, innerHeight*.25, 50); burst(innerWidth*.7, innerHeight*.3, 50); }, 200); }
}

/* ================= wiring ================= */
$('btn-review').onclick = ()=>{ sfx.tap(); startReview(); };
$('btn-quit').onclick = ()=>{ sfx.tap(); speechSynthesis.cancel(); renderHome(); show('screen-home'); };
$('btn-home').onclick = ()=>{ sfx.tap(); renderHome(); show('screen-home'); };
$('btn-retry').onclick = ()=>{
  sfx.tap();
  if (S.type === 'day') startDay(S.day); else startReview();
};
$('btn-retry-wrong').onclick = ()=>{
  sfx.tap();
  const list = S.wrongQs.map(q=>({d:q.d, i:q.i}));
  startSession({ type:'review', questions:makeQuestions(list), label:'📕 틀린 단어 재도전' });
};
$('btn-tts').onclick = ()=>{ if (S) speak(S.questions[S.idx].w); };
$('word').onclick = ()=>{ if (S) speak(S.questions[S.idx].w); };
$('btn-sound').onclick = function(){
  muted = !muted;
  localStorage.setItem(LS_MUTE, muted ? '1' : '0');
  this.textContent = muted ? '🔇' : '🔊';
  if (!muted) sfx.tap();
};
$('btn-sound').textContent = muted ? '🔇' : '🔊';
addEventListener('keydown', e=>{
  if (!$('screen-quiz').classList.contains('active') || !S || S.locked) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4){
    const b = document.querySelectorAll('.choice')[n-1];
    if (b) b.click();
  }
});

renderHome();
</script>
